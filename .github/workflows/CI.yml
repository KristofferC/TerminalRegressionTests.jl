name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
    tags: ["*"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_VERSION: '1.0.0'
      ZIG_VERSION: '0.17.1'
    strategy:
      matrix:
        channel: ['1.10', '1.11', '1.12', 'nightly']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/install-juliaup@v2
        with:
           channel: ${{matrix.channel}}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: actions/cache@v4
        id: ghostty-cache
        with:
          path: ${{ runner.temp }}/ghostty-vt
          key: ${{ runner.os }}-libghostty-vt-${{ env.LIBGHOSTTY_VT_VERSION }}
      - name: Build libghostty-vt
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          base=https://release.files.ghostty.org/libghostty-vt/$LIBGHOSTTY_VT_VERSION
          curl -sSfLO $base/SHA256SUMS
          for f in libghostty-vt-$LIBGHOSTTY_VT_VERSION.tar.gz libghostty-vt-$LIBGHOSTTY_VT_VERSION-deps.tar.gz; do
            curl -sSfLO $base/$f
            grep " $f\$" SHA256SUMS | sha256sum -c
            tar xzf $f
          done
          curl -sSfL https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz | tar xJ
          cd libghostty-vt-$LIBGHOSTTY_VT_VERSION
          ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache ../zig-x86_64-linux-$ZIG_VERSION/zig build \
            --prefix $RUNNER_TEMP/ghostty-vt \
            --system ../libghostty-vt-$LIBGHOSTTY_VT_VERSION-deps \
            -Doptimize=ReleaseFast -Dcpu=baseline
      - run: echo "LIBGHOSTTY_VT=$RUNNER_TEMP/ghostty-vt/lib/libghostty-vt.so" >> $GITHUB_ENV
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
